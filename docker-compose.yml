version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-enterprise-saas:latest
    container_name: nextjs-saas-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/saas_production}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-enterprise_production_auth_secret_key_991}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
